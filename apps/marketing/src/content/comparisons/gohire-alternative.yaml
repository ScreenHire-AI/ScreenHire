faqs:
  - question: 'Does GoHire have applicant fraud detection?'
    answer: 'GoHire documents no fraud or AI-applicant checks on its pricing or help pages as of 18 October 2026.'
  - question: 'Is ScreenHire priced per user like some ATSs?'
    answer: 'No. Like GoHire, every ScreenHire plan includes unlimited users.'
