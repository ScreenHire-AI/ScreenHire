name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The same suites as the local gate (`pnpm verify`), split into jobs that run side by side on GitHub's hosted Linux
# runners. Gate is the one required check: it passes only when checks, integration and e2e all succeeded. Lighthouse
# is report-only and outside the gate. The layout, how to read a failed run and the measured times are in
# docs/process/testing.md, "Continuous integration".
#
# Every job runs on ubuntu-24.04, pinned: ubuntu-latest moved to a new Ubuntu on 2026-10-19, and the caches are keyed
# on runner.os, which reads Linux on every release. Move all jobs together.
#
# No job reads a secret or runs on a self-hosted runner: this repository's logs and artifacts are public, and the
# stack needs no real credential (the consistency check's LLM is the Development fake). CiWorkflowTests fails on
# either, on a job without timeout-minutes, and on a Gate that does not need every test job.
#
# No test retries (flake policy, docs/process/testing.md). A test that fails here is fixed at its cause.

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  # The container images apps/apphost/AppHost.cs runs. The integration and end-to-end jobs pull them before the tests
  # start, so the pulls do not eat the fixture's 3-minute start limit. CiWorkflowTests fails when this list and
  # AppHost.cs differ.
  APPHOST_IMAGES: >-
    pgvector/pgvector:pg17
    mcr.microsoft.com/azure-storage/azurite:3.35.0
    axllent/mailpit:v1.31.2
    ghcr.io/navikt/mock-oauth2-server:6.1.2
    caddy:2.10.2-alpine

jobs:
  # Build with warnings as errors, the API contract, type checks, the frontend builds, Vitest and the .NET unit tests.
  # Every step runs even after one fails (`!cancelled()`), and the last step fails the job if any did, so one failure
  # never hides another and a run reports every broken check at once.
  checks:
    name: Build, contract, checks, Vitest, unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Set up the toolchain
        uses: ./.github/actions/setup
      - name: Build the solution, warnings as errors (verify:dotnet)
        id: dotnet
        if: ${{ !cancelled() }}
        run: pnpm verify:dotnet
      - name: API contract drift (verify:contract)
        id: contract
        if: ${{ !cancelled() }}
        run: pnpm verify:contract
      - name: Type checks (pnpm check)
        id: check
        if: ${{ !cancelled() }}
        run: pnpm check
      - name: Frontend builds (pnpm -r build)
        id: build
        if: ${{ !cancelled() }}
        run: pnpm -r build
      - name: Vitest (pnpm -r --if-present test)
        id: vitest
        if: ${{ !cancelled() }}
        run: pnpm -r --if-present test
      - name: .NET unit tests
        id: unit
        if: ${{ !cancelled() }}
        run: dotnet test --project tests/ScreenHire.UnitTests
      - name: Summarize
        if: ${{ !cancelled() }}
        env:
          DOTNET: ${{ steps.dotnet.outcome }}
          CONTRACT: ${{ steps.contract.outcome }}
          CHECK: ${{ steps.check.outcome }}
          BUILD: ${{ steps.build.outcome }}
          VITEST: ${{ steps.vitest.outcome }}
          UNIT: ${{ steps.unit.outcome }}
        run: |
          status=0
          report() {
            if [ "$2" = success ]; then echo "passed: $1"; else echo "FAILED: $1 ($2)"; status=1; fi
          }
          report "verify:dotnet" "$DOTNET"
          report "verify:contract" "$CONTRACT"
          report "pnpm check" "$CHECK"
          report "pnpm -r build" "$BUILD"
          report "Vitest" "$VITEST"
          report ".NET unit tests" "$UNIT"
          exit $status

  # tests/ScreenHire.IntegrationTests: the AppHost with no frontends, on the runner's Docker Engine.
  integration:
    name: Integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Set up the toolchain
        uses: ./.github/actions/setup
      - name: Pull the AppHost's container images
        run: printf '%s\n' $APPHOST_IMAGES | xargs -P 5 -n 1 docker pull -q
      - name: Integration tests
        run: dotnet test --project tests/ScreenHire.IntegrationTests
      # The fixture writes every resource's console log here (docs/process/testing.md, "AppHostFixture").
      - name: Upload resource logs
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: integration-logs
          path: tests/ScreenHire.IntegrationTests/bin/Debug/net10.0/TestResults/
          retention-days: 7
          if-no-files-found: ignore

  # tests/ScreenHire.E2E: Playwright's Chromium against the production builds (Frontends=Built).
  e2e:
    name: End-to-end tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Set up the toolchain
        uses: ./.github/actions/setup
        with:
          playwright: 'true'
      - name: Pull the AppHost's container images
        run: printf '%s\n' $APPHOST_IMAGES | xargs -P 5 -n 1 docker pull -q
      - name: Frontend builds (pnpm -r build)
        run: pnpm -r build
      - name: End-to-end tests
        run: dotnet test --project tests/ScreenHire.E2E
      # Resource logs, plus a full-page screenshot of every failed test (TestResults/screenshots).
      - name: Upload resource logs and screenshots
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results
          path: tests/ScreenHire.E2E/bin/Debug/net10.0/TestResults/
          retention-days: 7
          if-no-files-found: ignore

  # The marketing budgets (mobile LCP under 1.8 s, CLS under 0.05), only when the change touches what the marketing
  # build outputs, as the Testing column decides locally. Report-only and not in the gate: the LCP margin is about
  # 300 ms, and shared runners have no baseline yet. A miss is a warning on the run, not a red check.
  lighthouse:
    name: Lighthouse (report-only)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Does the change touch the marketing build?
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request) base="$PR_BASE" ;;
            push) base="$PUSH_BEFORE" ;;
            *) echo "marketing=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          if git diff --quiet "$base" HEAD -- apps/marketing packages/ui pnpm-lock.yaml; then
            echo "::notice::No change to apps/marketing, packages/ui or pnpm-lock.yaml, so Lighthouse did not run."
            echo "marketing=false" >> "$GITHUB_OUTPUT"
          else
            echo "marketing=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up the toolchain
        if: ${{ steps.changes.outputs.marketing == 'true' }}
        uses: ./.github/actions/setup
        with:
          playwright: 'true'
      - name: Build the marketing site
        if: ${{ steps.changes.outputs.marketing == 'true' }}
        run: pnpm --filter @screenhire/marketing build
      - name: Lighthouse budgets (verify:lighthouse)
        id: lighthouse
        if: ${{ steps.changes.outputs.marketing == 'true' }}
        continue-on-error: true
        run: pnpm verify:lighthouse
      - name: Report a budget miss
        if: ${{ steps.lighthouse.outcome == 'failure' }}
        run: echo "::warning::Lighthouse budgets failed on this runner (report-only). The step's log names the pages."

  # The one check branch protection requires. It runs whatever happened upstream (`always()`) and fails unless every
  # test job succeeded, so a skipped or cancelled job never reads as a pass.
  gate:
    name: Gate
    needs: [checks, integration, e2e]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every test job
        env:
          CHECKS: ${{ needs.checks.result }}
          INTEGRATION: ${{ needs.integration.result }}
          E2E: ${{ needs.e2e.result }}
        run: |
          status=0
          for pair in "checks=$CHECKS" "integration=$INTEGRATION" "e2e=$E2E"; do
            if [ "${pair#*=}" = success ]; then echo "passed: ${pair%%=*}"; else echo "FAILED: ${pair%%=*} (${pair#*=})"; status=1; fi
          done
          exit $status
